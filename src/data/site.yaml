intro: >-
  I'm a final-year undergraduate student at [School of Computing](https://cs.kaist.ac.kr/) of [KAIST](https://kaist.ac.kr). My main research interest is about 
  world models, or more broadly **generative models**, for Physical AI applications such as robotics and autonoumus vehicles. Having background in **computer graphics**, 
  I'm also intrigued by research in 3D rendering and simulation. 
note: >-
  I grew up in a lovely city named Yangon from Myanmar and moved to Korea since 2022 for my tertiary education. 

  Outside my study, I love doing anything related to **football**, be it playing it physically, playing FC, or watching matches. 
  
  I also find immense satisfaction in consuming well-crafted stories especially in the form of **novels** and story-driven **video games** 
  (Witcher 3, RDR2 for example). I believe stories can tell much about moments in the history and about humanity in ways nonfiction can never capture.
  
  **Photography** is another hobby of mine I recently picked up. Stay tune for my upcoming portfolio! ⚽📖🎮📸
  
